# Runs the build check and the full test suite on GitHub for every pull request and every push to main.
# A change is only "passing" when this check is green. See README "Automatic checks".
name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # the full suite outgrew 30 minutes (2026-11-26: the check on PR #87 was cut off before it finished)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Chrome and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ffmpeg
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
      - run: npm ci
      - run: npm run build
      - name: index.html matches the source
        run: npm run check-build
      - name: Full test suite
        # pipefail: without it the step took the exit code of tee, so a failed suite still showed green (found 2026-11-15, PR 51)
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log
      - name: Failed checks, in short
        if: failure()
        run: |
          echo "## Failed checks" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(FAIL|=== )" /tmp/test.log | grep -B1 "^FAIL" | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Test output (videos, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            tests/out/
            /tmp/test.log
          if-no-files-found: ignore
          retention-days: 14
